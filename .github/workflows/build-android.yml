name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      HOME: /root
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Prepare Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O /tmp/godot-templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android APK" build/UrbanFighters.apk
          test -s build/UrbanFighters.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UrbanFighters-Android
          path: build/UrbanFighters.apk
          if-no-files-found: error
          retention-days: 30
