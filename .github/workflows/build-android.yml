name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      HOME: /root
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Prepare Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz \
            -O /tmp/godot-templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" \
            "platforms;android-34" "build-tools;34.0.0" \
            "platforms;android-35" "build-tools;35.0.0"
          java_home="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Urban Fighters,C=ES"
          fi
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            'export/android/android_sdk_path = "/usr/lib/android-sdk"' \
            "export/android/java_sdk_path = \"$java_home\"" \
            'export/android/debug_keystore = "/root/.android/debug.keystore"' \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > "$HOME/.config/godot/editor_settings-4.4.tres"
          godot --headless --editor --quit --path .

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android APK" build/UrbanFighters.apk
          test -s build/UrbanFighters.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UrbanFighters-Android
          path: build/UrbanFighters.apk
          if-no-files-found: error
          retention-days: 30
